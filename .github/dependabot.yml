---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "quarterly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "quarterly"
    allow:
      - dependency-type: "all"
    groups:
      go-deps:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "quarterly"
    groups:
      docker:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directories:
      - "**/*"
    schedule:
      interval: "quarterly"
    groups:
      pip:
        patterns:
          - "*"
    cooldown:
      default-days: 7
